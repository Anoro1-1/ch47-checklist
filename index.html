<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CH-47F Chinook — Startup Checklist</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14; --bg2: #151820; --bg3: #1c2030;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #d8dce8; --text2: #8b90a0; --text3: #555a6a;
    --amber: #e8c84a; --amber-dark: #c4a530;
    --green: #4caf79; --green-bg: rgba(76,175,121,0.10);
    --red: #e05252; --red-bg: rgba(224,82,82,0.10);
    --blue: #5b9bd5; --blue-bg: rgba(91,155,213,0.10);
    --mono: 'Courier New', 'Consolas', monospace;
  }
  html { font-size: 14px; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; display: flex; flex-direction: column; }

  .header { background: var(--bg2); border-bottom: 1px solid var(--border2); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .heli-icon { width: 38px; height: 38px; background: var(--amber); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .header-title { font-size: 16px; font-weight: bold; color: #fff; letter-spacing: 0.07em; }
  .header-sub { font-size: 10px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
  .progress-wrap { text-align: right; }
  .progress-track { width: 160px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-bottom: 5px; }
  .progress-fill { height: 100%; background: var(--amber); border-radius: 2px; transition: width 0.3s ease; width: 0%; }
  .progress-label { font-size: 10px; color: var(--text3); letter-spacing: 0.05em; }

  .tabs { display: flex; gap: 2px; padding: 10px 20px 0; background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab { flex-shrink: 0; padding: 8px 18px; font-size: 11px; font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid transparent; border-bottom: none; background: transparent; color: var(--text3); cursor: pointer; border-radius: 4px 4px 0 0; transition: all 0.15s; outline: none; white-space: nowrap; }
  .tab:hover { color: var(--text); background: var(--bg3); }
  .tab.active { background: var(--bg); color: var(--amber); border-color: var(--border2); border-bottom-color: var(--bg); }
  .tab.done { color: var(--green); }
  .tab.active.done { color: var(--amber); }

  main { flex: 1; padding: 16px 20px 40px; max-width: 860px; width: 100%; margin: 0 auto; }

  .done-banner { display: none; background: var(--green-bg); border: 1px solid rgba(76,175,121,0.3); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--green); margin-bottom: 14px; align-items: center; gap: 8px; letter-spacing: 0.05em; }
  .done-banner.show { display: flex; }

  .section { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
  .section-header { display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; background: var(--bg3); border-bottom: 1px solid var(--border); user-select: none; transition: background 0.1s; flex-wrap: wrap; }
  .section-header:hover { background: rgba(255,255,255,0.04); }
  .section-loc { font-size: 9px; color: var(--amber-dark); letter-spacing: 0.07em; text-transform: uppercase; background: rgba(232,200,74,0.08); padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(232,200,74,0.15); flex-shrink: 0; }
  .section-name { font-size: 11px; font-weight: bold; color: var(--text); flex: 1; letter-spacing: 0.1em; text-transform: uppercase; }
  .section-count { font-size: 10px; color: var(--text3); }
  .section-chevron { font-size: 12px; color: var(--text3); transition: transform 0.2s; display: inline-block; }
  .section-header.open .section-chevron { transform: rotate(180deg); }
  .section-items { display: none; }
  .section-items.open { display: block; }

  .item-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: rgba(255,255,255,0.03); }
  .item-row.checked { background: rgba(76,175,121,0.06); }

  .item-cb { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; border: 1px solid var(--border2); border-radius: 3px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; position: relative; }
  .item-cb.checked { background: var(--green); border-color: var(--green); }
  .item-cb.checked::after { content: ''; width: 8px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); position: absolute; }

  .item-label { flex: 1; font-size: 12px; color: var(--text); line-height: 1.45; }
  .item-row.checked .item-label { color: var(--text3); text-decoration: line-through; }
  .item-sub { font-size: 10px; color: var(--text3); display: block; margin-top: 2px; font-style: italic; }

  .badge { font-size: 10px; padding: 2px 9px; border-radius: 3px; flex-shrink: 0; letter-spacing: 0.06em; font-weight: bold; white-space: nowrap; margin-top: 1px; }
  .badge-action { color: #1a1a1a; background: var(--amber); transition: background 0.2s, color 0.2s; }
  .badge-verify { color: var(--blue); background: var(--blue-bg); border: 1px solid rgba(91,155,213,0.25); font-weight: normal; transition: background 0.2s, color 0.2s, border-color 0.2s; }
  .badge-caution { color: var(--red); background: var(--red-bg); border: 1px solid rgba(224,82,82,0.3); font-weight: normal; }
  .item-row.checked .badge-action { background: var(--green); color: #fff; }
  .item-row.checked .badge-verify { background: var(--green-bg); color: var(--green); border-color: rgba(76,175,121,0.35); }

  .toolbar { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
  .btn { padding: 7px 16px; font-size: 11px; font-family: var(--mono); letter-spacing: 0.07em; text-transform: uppercase; border: 1px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; border-radius: 4px; transition: all 0.15s; outline: none; }
  .btn:hover { background: var(--bg3); color: var(--text); }
  .overall-status { font-size: 11px; color: var(--text3); margin-left: auto; letter-spacing: 0.05em; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="heli-icon">&#x1F681;</div>
    <div>
      <div class="header-title">CH-47F CHINOOK</div>
      <div class="header-sub">DCS World &middot; Startup Checklist</div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="gProgress"></div></div>
    <div class="progress-label" id="gLabel">0 / 0 erledigt</div>
  </div>
</div>

<div class="tabs" id="phaseTabs"></div>

<main>
  <div class="done-banner" id="doneBanner">&#x2714; <span id="doneBannerText">Phase abgeschlossen!</span></div>
  <div id="phaseContent"></div>
  <div class="toolbar">
    <button class="btn" onclick="resetPhase()">Phase zur&uuml;cksetzen</button>
    <button class="btn" onclick="resetAll()">Alles zur&uuml;cksetzen</button>
    <span class="overall-status" id="overallStatus"></span>
  </div>
</main>

<script>
const phases = [
  {
    id: "p1", name: "Vorbereitung",
    sections: [
      {
        loc: "Canted Console / Right", name: "Parking Brake",
        items: [
          { l: "PARKING BRAKE", a: "SET" }
        ]
      },
      {
        loc: "Overhead Console / Left", name: "EXT LTG Panel",
        items: [
          { l: "ANTI COL", a: "FAA / BOTH" },
          { l: "POSN", a: "AS REQUIRED" }
        ]
      },
      {
        loc: "Overhead Console / Left", name: "CPLT LTG",
        items: [
          { l: "CPLT INST", a: "AS REQUIRED" },
          { l: "OVHD CSL", a: "AS REQUIRED" }
        ]
      },
      {
        loc: "Overhead Console / Left", name: "ELEC \u2014 Battery",
        items: [
          { l: "BATT Switch", a: "ON" },
          { l: "UTIL PRES LIGHT", a: "VERIFY ON", v: true }
        ]
      },
      {
        loc: "Overhead Console / Left", name: "TROOP WARN",
        items: [
          { l: "JUMP LT GREEN / RED", a: "ALARM ON / OFF" }
        ]
      }
    ]
  },
  {
    id: "p2", name: "APU Start",
    sections: [
      {
        loc: "Overhead Console / Left", name: "ELEC \u2014 APU",
        items: [
          { l: "APU RUN", a: "5 SEKUNDEN", s: "Schalter auf RUN halten" },
          { l: "APU START", a: "2 SEKUNDEN", s: "Dann zur\u00fcck auf RUN" },
          { l: "APU RDY LIGHT", a: "VERIFY ON", v: true },
          { l: "UTIL PRES LIGHT", a: "VERIFY OFF", v: true },
          { l: "APU GEN", a: "ON" },
          { l: "MFD\u02bcs", a: "VERIFY ON", v: true, s: "Set as required" }
        ]
      },
      {
        loc: "Overhead Console / Right", name: "PLT LTG",
        items: [
          { l: "CTR INST", a: "AS REQUIRED" },
          { l: "PLT INST", a: "AS REQUIRED" }
        ]
      },
      {
        loc: "Overhead Console / Right", name: "HYD",
        items: [
          { l: "PWR XFER 1", a: "ON" },
          { l: "PWR XFER 2", a: "ON" }
        ]
      },
      {
        loc: "Overhead Console / Right", name: "Flight Controls",
        items: [
          { l: "COLLECTIVE", a: "CHECK", v: true },
          { l: "CYCLIC", a: "CHECK", v: true },
          { l: "RUDDER PEDALS", a: "CHECK", v: true }
        ]
      },
      {
        loc: "Center Console", name: "Lamp Test / System Sel",
        items: [
          { l: "LAMP TEST", a: "CHECK", v: true },
          { l: "SYSTEM SEL", a: "BOTH" }
        ]
      },
      {
        loc: "Center Console", name: "CDU",
        items: [
          { l: "L1 (POWER) \u2014 alle CDUs", a: "ALL ON" },
          { l: "R2 (IDX) REF SELECT / BARO SET", a: "SET" }
        ]
      },
      {
        loc: "Overhead Console / Center", name: "FADEC",
        items: [
          { l: "B/U PWR", a: "ON" },
          { l: "LOAD SHARE", a: "TRQ" }
        ]
      }
    ]
  },
  {
    id: "p3", name: "Engine 1",
    sections: [
      {
        loc: "Overhead Console / Center", name: "FUEL PUMP \u2014 ENG 1",
        items: [
          { l: "ENG1 MAIN AFT", a: "ON" },
          { l: "ENG1 MAIN FWD", a: "ON" },
          { l: "XFEED", a: "OPEN" }
        ]
      },
      {
        loc: "Overhead Console / Center", name: "Engine 1 Start",
        items: [
          { l: "ENG COND \u2014 ENG 1", a: "GROUND" },
          { l: "FADEC ENG START 1", a: "PRESS & HOLD", c: true, s: "Halten bis NG \u2265 12%" },
          { l: "MFD POWER TRAIN \u2014 ENG 1 NG", a: "VERIFY \u2265 50%", v: true }
        ]
      }
    ]
  },
  {
    id: "p4", name: "Engine 2",
    sections: [
      {
        loc: "Overhead Console / Center", name: "FUEL PUMP \u2014 ENG 2",
        items: [
          { l: "ENG2 MAIN AFT", a: "ON" },
          { l: "ENG2 MAIN FWD", a: "ON" }
        ]
      },
      {
        loc: "Overhead Console / Center", name: "Engine 2 Start",
        items: [
          { l: "ENG COND \u2014 ENG 2", a: "GROUND" },
          { l: "FADEC ENG START 2", a: "PRESS & HOLD", c: true, s: "Halten bis NG \u2265 12%" },
          { l: "MFD POWER TRAIN \u2014 ENG 2 NG", a: "VERIFY \u2265 50%", v: true }
        ]
      },
      {
        loc: "Overhead Console / Center", name: "ENG COND \u2014 auf FLIGHT",
        items: [
          { l: "ENG COND ENG 1", a: "FLIGHT" },
          { l: "ENG COND ENG 2", a: "FLIGHT" }
        ]
      }
    ]
  },
  {
    id: "p5", name: "Nach Start",
    sections: [
      {
        loc: "Overhead Console / Left", name: "Generator & APU",
        items: [
          { l: "GEN 1", a: "ON" },
          { l: "GEN 2", a: "ON" },
          { l: "APU GEN", a: "OFF" },
          { l: "APU", a: "OFF" }
        ]
      },
      {
        loc: "Overhead Console / Right", name: "PWR XFER abschalten",
        items: [
          { l: "PWR XFER 1", a: "OFF" },
          { l: "PWR XFER 2", a: "OFF" }
        ]
      },
      {
        loc: "Overhead Console / Center", name: "FUEL PUMP \u2014 AUX",
        items: [
          { l: "ENG 1 AUX AFT", a: "ON" },
          { l: "ENG 1 AUX FWD", a: "ON" },
          { l: "ENG 2 AUX AFT", a: "ON" },
          { l: "ENG 2 AUX FWD", a: "ON" },
          { l: "XFEED", a: "CLOSE" }
        ]
      },
      {
        loc: "Overhead Console / Center", name: "FADEC \u2014 Final",
        items: [
          { l: "FADEC 1", a: "PRI" },
          { l: "FADEC 2", a: "PRI" }
        ]
      }
    ]
  }
];

const state = {};
phases.forEach(p => {
  state[p.id] = {};
  p.sections.forEach((s, si) => s.items.forEach((_, ii) => { state[p.id][si+'-'+ii] = false; }));
});
let cur = 0;

function pStats(id) { const k=Object.keys(state[id]); return {done:k.filter(x=>state[id][x]).length, total:k.length}; }
function aStats() { let d=0,t=0; phases.forEach(p=>{const s=pStats(p.id);d+=s.done;t+=s.total;}); return {done:d,total:t}; }

function renderTabs() {
  document.getElementById('phaseTabs').innerHTML = phases.map((p,i) => {
    const s=pStats(p.id), done=s.done===s.total;
    return `<button class="tab${i===cur?' active':''}${done?' done':''}" onclick="sw(${i})">${p.name}${done?' \u2714':''}</button>`;
  }).join('');
}

function renderContent() {
  const phase = phases[cur];
  let html = '';
  phase.sections.forEach((sec, si) => {
    const sd = sec.items.filter((_,ii)=>state[phase.id][si+'-'+ii]).length;
    html += `<div class="section">
      <div class="section-header open" onclick="togSec(this,'si-${si}')">
        <span class="section-loc">${sec.loc}</span>
        <span class="section-name">${sec.name}</span>
        <span class="section-count" id="sc-${si}">${sd}/${sec.items.length}</span>
        <span class="section-chevron">\u25b2</span>
      </div>
      <div class="section-items open" id="si-${si}">`;
    sec.items.forEach((item, ii) => {
      const key=si+'-'+ii, chk=state[phase.id][key];
      const badge = item.c ? `<span class="badge badge-caution">! ACHTUNG</span>`
                  : item.v ? `<span class="badge badge-verify">${item.a}</span>`
                  : `<span class="badge badge-action">${item.a}</span>`;
      html += `<div class="item-row${chk?' checked':''}" onclick="togItem('${phase.id}','${key}','${si}',this)">
        <div class="item-cb${chk?' checked':''}"></div>
        <span class="item-label">${item.l}${item.s?`<span class="item-sub">${item.s}</span>`:''}</span>
        ${badge}
      </div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('phaseContent').innerHTML = html;
  updProg();
}

function togSec(h, id) { h.classList.toggle('open'); document.getElementById(id).classList.toggle('open'); }

function togItem(pid, key, si, row) {
  state[pid][key] = !state[pid][key];
  const chk = state[pid][key];
  row.classList.toggle('checked', chk);
  row.querySelector('.item-cb').classList.toggle('checked', chk);
  const phase=phases.find(p=>p.id===pid), sec=phase.sections[parseInt(si)];
  const d=sec.items.filter((_,ii)=>state[pid][si+'-'+ii]).length;
  const el=document.getElementById('sc-'+si); if(el) el.textContent=d+'/'+sec.items.length;
  updProg();
}

function updProg() {
  const ph=phases[cur], ps=pStats(ph.id), gs=aStats(), pct=ps.total?Math.round(ps.done/ps.total*100):0;
  document.getElementById('gProgress').style.width=Math.round(gs.done/gs.total*100)+'%';
  document.getElementById('gLabel').textContent=gs.done+' / '+gs.total+' erledigt';
  document.getElementById('overallStatus').textContent='Phase: '+ps.done+'/'+ps.total+' ('+pct+'%)';
  const b=document.getElementById('doneBanner');
  if(ps.done===ps.total&&ps.total>0){document.getElementById('doneBannerText').textContent=ph.name+' abgeschlossen!';b.classList.add('show');}
  else b.classList.remove('show');
  renderTabs();
}

function sw(i){cur=i;renderTabs();renderContent();}
function resetPhase(){const id=phases[cur].id;Object.keys(state[id]).forEach(k=>state[id][k]=false);renderContent();renderTabs();}
function resetAll(){phases.forEach(p=>Object.keys(state[p.id]).forEach(k=>state[p.id][k]=false));renderContent();renderTabs();}

renderTabs();
renderContent();
</script>
</body>
</html>
